# HomeClinic — production stack for GCP VM
# Usage:
#   cp .env.example .env   # edit secrets
#   docker compose up -d --build
#   Open http://YOUR_EXTERNAL_IP

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeclinic}
      POSTGRES_DB: ${POSTGRES_DB:-homeclinic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeclinic} -d ${POSTGRES_DB:-homeclinic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-homeclinic}:${POSTGRES_PASSWORD:-homeclinic}@db:5432/${POSTGRES_DB:-homeclinic}
      CLINIC_NAME: ${CLINIC_NAME:-HomeClinic}
      CLINIC_PHONE: ${CLINIC_PHONE:-9XXXXXXXXX}
      CLINIC_HOURS: ${CLINIC_HOURS:-9 AM – 8 PM}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homeclinic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Clinic Admin}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      CLINIC_NOTIFY_EMAIL: ${CLINIC_NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CLINIC_NAME: ${CLINIC_NAME:-HomeClinic}
        INTERNAL_API_URL: http://api:8000
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_CLINIC_NAME: ${CLINIC_NAME:-HomeClinic}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  uploads:
